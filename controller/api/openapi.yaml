openapi: 3.1.0
info:
  title: DevMonitor Gateway Controller API
  version: 0.1.0
  description: |
    Reference contract for the DevMonitor 5.0 Gateway Edition controller.
    This contract is not a deployed service. User and gateway bearer tokens are
    validated by the server; database IDs supplied by clients are never treated
    as proof of ownership.
servers:
  - url: https://gateway.example.invalid
    description: Placeholder only; no production host has been selected.
tags:
  - name: Client
  - name: Personal gateways
  - name: Gateway worker
paths:
  /v1/client/check-batches:
    post:
      tags: [Client]
      summary: Queue a batch of SMS checks
      security:
        - UserBearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 12, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, devices]
              properties:
                tenant_id: { type: string, format: uuid }
                preferred_gateway_id: { type: [string, "null"], format: uuid }
                devices:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [device_id, query_profile]
                    properties:
                      device_id: { type: string, minLength: 1, maxLength: 128 }
                      query_profile: { type: string, minLength: 1, maxLength: 64 }
                app_version: { type: string, maxLength: 40 }
      responses:
        "202":
          description: Batch durably accepted; no device result is implied.
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, status, total_jobs]
                properties:
                  batch_id: { type: string, format: uuid }
                  status: { const: QUEUED }
                  total_jobs: { type: integer }
        "200":
          description: Idempotent replay; returns the existing batch.
        "403": { description: User is not a tenant member or lacks device/gateway access. }
        "409": { description: Idempotency key conflicts with a different request. }
  /v1/client/check-batches/{batch_id}:
    get:
      tags: [Client]
      summary: Read batch progress and per-device states
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - in: query
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Authorized batch state. }
        "404": { description: Batch not found in the caller's authorized tenant. }
  /v1/client/check-batches/{batch_id}/queue:
    get:
      tags: [Client]
      summary: Read live queue position and estimated wait/completion
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - in: query
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Authorized queue snapshot. Includes assigned Gateway, requests/devices ahead, global pending device count and approximate start/completion estimates. }
        "404": { description: Batch not found for the authenticated requester. }
  /v1/client/check-batches/{batch_id}/cancel:
    post:
      tags: [Client]
      summary: Cancel the caller's own request
      description: Queued and pre-send leased jobs are cancelled. A send already in progress or an ambiguous SMS attempt is allowed to resolve safely; completed results are retained.
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - in: query
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: [string, "null"], maxLength: 240 }
      responses:
        "200": { description: Cancellation accepted or request already terminal. Returns completed, cancelled and in-flight counts. }
        "404": { description: Batch not found for the authenticated requester. }
  /v1/client/tenants/{tenant_id}/gateway-analytics:
    get:
      tags: [Client]
      summary: Read tenant administrator Gateway analytics
      description: Aggregate tenant-scoped request, device, wait, response, timeout, cancellation and Gateway health metrics. Only tenant OWNER or ADMIN members may read it.
      security:
        - UserBearerAuth: []
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Tenant-scoped Gateway analytics and 30-day daily activity. }
        "403": { description: Tenant administrator access required. }
        "404": { description: Tenant not found. }
  /v1/client/devices/{device_id}/latest:
    get:
      tags: [Client]
      summary: Read the latest cached daily result
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Latest accepted cached result, including checked_at. }
        "404": { description: No cached result or no authorized device access. }
  /v1/client/devices/{device_id}/history:
    get:
      tags: [Client]
      summary: Read cached SMS Checker history
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Authorized history, capped to the configured retention window. }
        "400": { description: Invalid date range or range exceeds retention policy. }
  /v1/client/gateways:
    get:
      tags: [Personal gateways]
      summary: List the caller's paired personal gateways
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Only gateways owned by the authenticated user.
    post:
      tags: [Personal gateways]
      summary: Register another DevMonitor phone as a personal gateway
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Gateway registered. gateway_token is returned once and must be stored securely.
        "400": { description: Invalid registration details. }
  /v1/client/gateways/{gateway_id}/pool-participation:
    patch:
      tags: [Personal gateways]
      summary: Enable or disable this owner's gateway's shared-pool participation
      security:
        - UserBearerAuth: []
      parameters:
        - in: path
          name: gateway_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept_pool_jobs]
              properties:
                accept_pool_jobs: { type: boolean }
      responses:
        "200": { description: Pool preference updated for an owned gateway. }
        "404": { description: Gateway is not owned by the authenticated user. }
  /v1/client/gateways/{gateway_id}:
    delete:
      tags: [Personal gateways]
      summary: Revoke and unpair an owned personal gateway
      security:
        - UserBearerAuth: []
      parameters:
        - in: path
          name: gateway_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Credential revoked; an active SMS transaction is resolved safely and no new jobs are assigned. }
        "404": { description: Gateway is not owned by the authenticated user. }
  /v1/gateway/heartbeat:
    post:
      tags: [Gateway worker]
      summary: Report gateway health and readiness
      security:
        - GatewayBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_version, sms_permission_ready, telephony_ready, network_ready]
              properties:
                app_version: { type: string }
                sms_permission_ready: { type: boolean }
                telephony_ready: { type: boolean }
                network_ready: { type: boolean }
                last_successful_3030_at: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: Heartbeat recorded. Quarantine is never cleared by heartbeat. }
        "401": { description: Invalid or revoked gateway credential. }
  /v1/gateway/active-attempt:
    get:
      tags: [Gateway worker]
      summary: Recover active attempt metadata after a gateway process restart
      security:
        - GatewayBearerAuth: []
      responses:
        "200": { description: Active attempt metadata; the lease token is not returned and must have been retained locally. }
        "401": { description: Invalid or revoked gateway credential. }
  /v1/gateway/jobs/claim:
    post:
      tags: [Gateway worker]
      summary: Atomically claim one eligible job
      security:
        - GatewayBearerAuth: []
      responses:
        "200":
          description: One leased job, or an empty assignment when no work is eligible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: [string, "null"], format: uuid }
                  attempt_id: { type: [string, "null"], format: uuid }
                  lease_token: { type: [string, "null"] }
                  device_id: { type: [string, "null"] }
                  query_profile: { type: [string, "null"] }
                  lease_expires_at: { type: [string, "null"], format: date-time }
        "401": { description: Invalid or revoked gateway credential. }
  /v1/gateway/jobs/{job_id}/sending:
    post:
      tags: [Gateway worker]
      summary: Mark that the gateway is about to send the SMS
      security:
        - GatewayBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, lease_token]
              properties:
                attempt_id: { type: string, format: uuid }
                lease_token: { type: string }
      responses:
        "200": { description: State transition accepted. }
        "409": { description: Lease expired or state transition is no longer valid. }
  /v1/gateway/jobs/{job_id}/awaiting-reply:
    post:
      tags: [Gateway worker]
      summary: Confirm SMS send and begin reply wait
      security:
        - GatewayBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, lease_token, sms_sent_at]
              properties:
                attempt_id: { type: string, format: uuid }
                lease_token: { type: string }
                sms_sent_at: { type: string, format: date-time }
      responses:
        "200": { description: Reply wait recorded. }
        "409": { description: Invalid attempt or lease. }
  /v1/gateway/jobs/{job_id}/result:
    post:
      tags: [Gateway worker]
      summary: Submit a parsed 3030 result for the active attempt
      security:
        - GatewayBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, lease_token, business_date, checked_at, received_at, values, parser_version]
              properties:
                attempt_id: { type: string, format: uuid }
                lease_token: { type: string }
                business_date: { type: string, format: date }
                checked_at: { type: string, format: date-time }
                received_at: { type: string, format: date-time }
                values: { type: object, additionalProperties: { type: [integer, "null"] } }
                parser_version: { type: string }
      responses:
        "200": { description: Accepted result; daily cache changes only if checked_at is newer. }
        "409": { description: Stale, mismatched, duplicate or expired attempt. }
  /v1/gateway/jobs/{job_id}/send-failed:
    post:
      tags: [Gateway worker]
      summary: Report a definitive local send failure before SMS transmission
      description: Use only when the gateway can prove the SMS was not transmitted. Any uncertain outcome must use the ambiguous endpoint.
      security:
        - GatewayBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, lease_token, failure_code]
              properties:
                attempt_id: { type: string, format: uuid }
                lease_token: { type: string }
                failure_code: { type: string, maxLength: 100 }
      responses:
        "200": { description: Definitive send failure recorded. }
        "409": { description: Attempt is not in a valid pre-transmission state. }
  /v1/gateway/jobs/{job_id}/ambiguous:
    post:
      tags: [Gateway worker]
      summary: Report an uncertain send/reply outcome; gateway is quarantined
      security:
        - GatewayBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, reason]
              properties:
                attempt_id: { type: string, format: uuid }
                reason: { type: string, maxLength: 160 }
      responses:
        "200": { description: Attempt marked ambiguous and gateway quarantined. }
        "409": { description: Attempt is no longer active. }
components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication ID token validated for the configured Firebase project using Google's Secure Token signing keys.
    GatewayBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Random installation credential; server hashes and verifies it.
  parameters:
    BatchId:
      in: path
      name: batch_id
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: job_id
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      in: path
      name: device_id
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
