name: DevMonitor Original Card Legibility Trial
on:
  push:
    branches: [trial/original-card-clear-legibility]
    paths:
      - 'hybrid-overrides/**'
      - '.github/workflows/build-original-card-legibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract v337 Recheck baseline and apply original-card enhancement
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'DevMonitor-An-v337-*.zip' | head -n 1)"
          [ -n "$ZIP_FILE" ] || { echo "Android v337 Recheck baseline ZIP not found."; exit 1; }
          echo "Using baseline: $ZIP_FILE"
          rm -rf build-android
          mkdir -p build-android
          unzip -q "$ZIP_FILE" -d build-android
          base64 -d hybrid-overrides/android-original-card.patch.gz.b64 > /tmp/original-card.patch.gz
          gzip -t /tmp/original-card.patch.gz
          python3 -c "import gzip,sys; sys.stdout.buffer.write(gzip.decompress(open('/tmp/original-card.patch.gz','rb').read()))" > /tmp/original-card.patch
          echo "Patch bytes: $(wc -c < /tmp/original-card.patch)"
          git apply --directory=build-android --check /tmp/original-card.patch
          git apply --directory=build-android /tmp/original-card.patch
          # Correct the extracted refactor's Canvas context and remove a stale duplicate
          # PNG-writer tail that was left after moving the drawing routine.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-android/app/src/main/java/com/aziitech/simregmonitor/ReportExportPack.kt")
          s = p.read_text()
          old_sig = "private fun drawPaymentCard(canvas: Canvas, d: PaymentCardSharePayload, outputScale: Float)"
          new_sig = "private fun drawPaymentCard(context: Context, canvas: Canvas, d: PaymentCardSharePayload, outputScale: Float)"
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          s = s.replace("drawPaymentCard(canvas, d, outputScale)", "drawPaymentCard(context, canvas, d, outputScale)")
          s = s.replace("drawPaymentCard(page.canvas, d, pageWidth.toFloat() / 1080f)", "drawPaymentCard(context, page.canvas, d, pageWidth.toFloat() / 1080f)")
          import re
          s, count = re.subn(
              r"\n[ \t]*FileOutputStream\(file\)\.use \{ bitmap\.compress\(Bitmap\.CompressFormat\.PNG, 100, it\) \}\n[ \t]*bitmap\.recycle\(\)\n[ \t]*return file\n[ \t]*\}\n\n[ \t]*private fun drawWrapped",
              "\n    private fun drawWrapped",
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected to remove exactly one orphaned PNG-writer tail; removed " + str(count))
          if "bitmap.compress(Bitmap.CompressFormat.PNG, 100, it) }\n        bitmap.recycle()\n        return file\n    }\n\n    private fun drawWrapped" in s:
              raise SystemExit("Stale duplicate PNG writer remains")
          p.write_text(s)
          PY
          grep -n 'versionCode\|versionName' build-android/app/build.gradle.kts
          grep -n 'sharePaymentCardPdfAsync' build-android/app/src/main/java/com/aziitech/simregmonitor/ReportExportPack.kt
          grep -n 'Share this card as PDF' build-android/app/src/main/java/com/aziitech/simregmonitor/ManagementScreens.kt
          chmod +x build-android/gradlew
      - name: Capture patched Kotlin sources for compile correction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v339-kotlin-source-diagnostics
          path: |
            build-android/app/src/main/java/com/aziitech/simregmonitor/ReportExportPack.kt
            build-android/app/src/main/java/com/aziitech/simregmonitor/MainActivity.kt
          if-no-files-found: warn
          retention-days: 7
      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd build-android
          ./gradlew assembleDebug --stacktrace
      - name: Package updated source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build-android
          zip -qr ../DevMonitor-An-v339-4.7.0-TARGET-ORIGINAL-CARD-LEGIBILITY-RECHECK.zip . -x '.gradle/*' 'app/build/*' 'build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v339-Original-Card-Legibility-APK
          path: build-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v339-Original-Card-Legibility-Source
          path: DevMonitor-An-v339-4.7.0-TARGET-ORIGINAL-CARD-LEGIBILITY-RECHECK.zip
          if-no-files-found: error
          retention-days: 30
