name: DevMonitor Original Card Legibility Trial
on:
  push:
    branches: [trial/original-card-clear-legibility]
    paths:
      - 'hybrid-overrides/**'
      - '.github/workflows/build-original-card-legibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract v337 Recheck baseline and apply original-card enhancement
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'DevMonitor-An-v337-*.zip' | head -n 1)"
          [ -n "$ZIP_FILE" ] || { echo "Android v337 Recheck baseline ZIP not found."; exit 1; }
          echo "Using baseline: $ZIP_FILE"
          rm -rf build-android
          mkdir -p build-android
          unzip -q "$ZIP_FILE" -d build-android
          base64 -d hybrid-overrides/android-original-card.patch.gz.b64 > /tmp/original-card.patch.gz
          gzip -t /tmp/original-card.patch.gz
          python3 -c "import gzip,sys; sys.stdout.buffer.write(gzip.decompress(open('/tmp/original-card.patch.gz','rb').read()))" > /tmp/original-card.patch
          echo "Patch bytes: $(wc -c < /tmp/original-card.patch)"
          git apply --directory=build-android --check /tmp/original-card.patch
          git apply --directory=build-android /tmp/original-card.patch
          grep -n 'versionCode\|versionName' build-android/app/build.gradle.kts
          grep -n 'sharePaymentCardPdfAsync' build-android/app/src/main/java/com/aziitech/simregmonitor/ReportExportPack.kt
          grep -n 'Share this card as PDF' build-android/app/src/main/java/com/aziitech/simregmonitor/ManagementScreens.kt
          chmod +x build-android/gradlew
      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd build-android
          ./gradlew assembleDebug --stacktrace
      - name: Package updated source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build-android
          zip -qr ../DevMonitor-An-v339-4.7.0-TARGET-ORIGINAL-CARD-LEGIBILITY-RECHECK.zip . -x '.gradle/*' 'app/build/*' 'build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v339-Original-Card-Legibility-APK
          path: build-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v339-Original-Card-Legibility-Source
          path: DevMonitor-An-v339-4.7.0-TARGET-ORIGINAL-CARD-LEGIBILITY-RECHECK.zip
          if-no-files-found: error
          retention-days: 30
