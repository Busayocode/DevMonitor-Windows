name: DevMonitor Android v340 History Integration
on:
  push:
    branches: [trial/v340-sms-history-integration]
    paths:
      - '.github/workflows/build-v340-history-integration.yml'
      - 'hybrid-overrides/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-v340:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v339 integration baseline
        uses: actions/checkout@v4
      - name: Checkout isolated History feature patch
        uses: actions/checkout@v4
        with:
          ref: History
          path: history-branch
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract v337 baseline and apply v339 card changes
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'DevMonitor-An-v337-*.zip' | head -n 1)"
          [ -n "$ZIP_FILE" ] || { echo 'Android v337 source baseline ZIP not found.'; exit 1; }
          rm -rf build-android
          mkdir -p build-android
          unzip -q "$ZIP_FILE" -d build-android
          base64 -d hybrid-overrides/android-original-card.patch.gz.b64 > /tmp/original-card.patch.gz
          gzip -t /tmp/original-card.patch.gz
          python3 -c "import gzip,sys; sys.stdout.buffer.write(gzip.decompress(open('/tmp/original-card.patch.gz','rb').read()))" > /tmp/original-card.patch
          git apply --directory=build-android --check /tmp/original-card.patch
          git apply --directory=build-android /tmp/original-card.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build-android/app/src/main/java/com/aziitech/simregmonitor/ReportExportPack.kt")
          s = p.read_text()
          s = s.replace(
              "private fun drawPaymentCard(canvas: Canvas, d: PaymentCardSharePayload, outputScale: Float)",
              "private fun drawPaymentCard(context: Context, canvas: Canvas, d: PaymentCardSharePayload, outputScale: Float)",
              1,
          )
          s = s.replace("drawPaymentCard(canvas, d, outputScale)", "drawPaymentCard(context, canvas, d, outputScale)")
          s = s.replace("drawPaymentCard(page.canvas, d, pageWidth.toFloat() / 1080f)", "drawPaymentCard(context, page.canvas, d, pageWidth.toFloat() / 1080f)")
          s, count = re.subn(
              r"\n[ \t]*FileOutputStream\(file\)\.use \{ bitmap\.compress\(Bitmap\.CompressFormat\.PNG, 100, it\) \}\n[ \t]*bitmap\.recycle\(\)\n[ \t]*return file\n[ \t]*\}\n\n[ \t]*private fun drawWrapped",
              "\n    private fun drawWrapped", s, count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one stale PNG-writer tail removal, got {count}")
          old = "val label = Paint(anti).apply { color = 0xFF42566D.toInt(); textSize = 23f }"
          new = "val label = Paint(anti).apply { color = 0xFF33495F.toInt(); textSize = 23f }"
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one original card supporting-label paint.")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply History daily-history implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode history-branch/android-history.patch.gz.b64 | gzip -dc > /tmp/android-history.patch
          patch --batch --forward -p1 -d build-android < /tmp/android-history.patch
          echo 'History daily-history patch applied to the v339 source baseline.'
      - name: Reapply v339 SMS Checker ordering, Recheck priority and partner timeout
        shell: bash
        run: |
          set -euo pipefail
          python3 hybrid-overrides/apply-sms-checker-improvements.py build-android/app/src/main/java/com/aziitech/simregmonitor/MainActivity.kt
      - name: Set integrated Android version to v340 and verify feature wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("build-android")
          gradle = list(root.rglob("app/build.gradle.kts"))
          main = list(root.rglob("MainActivity.kt"))
          store = list(root.rglob("SmsCheckerDailyHistoryStore.kt"))
          dialog = list(root.rglob("SmsCheckerHistoryDialog.kt"))
          if not all(len(x) == 1 for x in (gradle, main, store, dialog)):
              raise SystemExit("Expected exactly one Android app Gradle file, MainActivity, history store and history dialog.")
          g = gradle[0].read_text()
          g, c1 = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 340", g, count=1)
          g, c2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY-ORIGINAL-CARD-LEGIBILITY-V340"', g, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not safely update exactly one versionCode and versionName.")
          gradle[0].write_text(g)
          source = main[0].read_text()
          history = store[0].read_text()
          if "sms_checker_devices_history.db" not in source or "sms_checker_partners_history.db" not in source:
              raise SystemExit("Separate device and partner history databases are not wired.")
          if "recordCompleted(record)" not in source:
              raise SystemExit("Completed SMS Checker records are not connected to history storage.")
          if "AttemptStatus.TIMEOUT" not in history or "AttemptStatus.SEND_FAILED" not in history:
              raise SystemExit("History storage does not include timeout and send-failed outcomes.")
          if "versionCode = 340" not in g or "V340" not in g:
              raise SystemExit("v340 version metadata verification failed.")
          print("Verified v340, daily history database wiring, and failure outcomes.")
          PY
          chmod +x "$(find build-android -maxdepth 6 -type f -name gradlew | head -n 1)"
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find build-android -maxdepth 6 -type f -name gradlew | head -n 1)"
          [ -n "$GRADLEW" ] || { echo 'Gradle wrapper not found.'; exit 1; }
          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd -P)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Prepare release signing and Drive configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FIELD_PULSE_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_REPORT_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo 'ERROR: release keystore secret is missing.'; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo 'ERROR: RELEASE_STORE_PASSWORD secret is missing.'; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo 'ERROR: RELEASE_KEY_ALIAS secret is missing.'; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo 'ERROR: RELEASE_KEY_PASSWORD secret is missing.'; exit 1; }
          [ -n "$DRIVE_API_KEY" ] || { echo 'ERROR: DRIVE_REPORT_API_KEY secret is missing.'; exit 1; }
          KEYSTORE_PATH="$PROJECT_DIR/app/fieldpulse-release.jks"
          mkdir -p "$PROJECT_DIR/app"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ] || { echo 'Decoded release keystore is empty.'; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          FILTERED_PROPERTIES="$(mktemp)"
          sed -E '/^[[:space:]]*RELEASE_STORE_FILE[[:space:]]*=/d; /^[[:space:]]*RELEASE_STORE_PASSWORD[[:space:]]*=/d; /^[[:space:]]*RELEASE_KEY_ALIAS[[:space:]]*=/d; /^[[:space:]]*RELEASE_KEY_PASSWORD[[:space:]]*=/d; /^[[:space:]]*DRIVE_REPORT_API_KEY[[:space:]]*=/d' "$PROJECT_DIR/gradle.properties" > "$FILTERED_PROPERTIES"
          cat "$FILTERED_PROPERTIES" > "$PROJECT_DIR/gradle.properties"
          rm -f "$FILTERED_PROPERTIES"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            printf 'DRIVE_REPORT_API_KEY=%s\n' "$DRIVE_API_KEY"
          } >> "$PROJECT_DIR/gradle.properties"
      - name: Verify Firebase package
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          grep -q '"package_name": "com.aziitech.simregmonitor"' app/google-services.json
      - name: Build signed Android release
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify release APK signing identity
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          [ -f "$APK" ] || { echo 'Release APK was not produced.'; exit 1; }
          EXPECTED='8A:C3:1B:96:52:7D:F8:96:83:D5:84:A6:D5:99:10:0D:88:5D:F5:36'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [ -n "$APKSIGNER" ] || { echo 'apksigner not found.'; exit 1; }
          python3 - "$APKSIGNER" "$APK" "$EXPECTED" <<'PY'
          import re, subprocess, sys
          tool, apk, expected = sys.argv[1:]
          result = subprocess.run([tool, "verify", "--verbose", "--print-certs", apk], text=True, capture_output=True)
          output = (result.stdout or "") + "\n" + (result.stderr or "")
          if result.returncode:
              print(output)
              raise SystemExit(result.returncode)
          match = re.search(r"certificate\s+SHA-1\s+digest\s*:\s*([0-9a-fA-F:]+)", output, re.I)
          if not match or match.group(1).replace(":", "").lower() != expected.replace(":", "").lower():
              print(output)
              raise SystemExit("APK signing SHA-1 does not match the registered release identity.")
          print("Release APK signing identity verified.")
          PY
      - name: Package v340 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd build-android && zip -qr ../DevMonitor-An-v340-4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY-ORIGINAL-CARD-LEGIBILITY.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t DevMonitor-An-v340-4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY-ORIGINAL-CARD-LEGIBILITY.zip >/dev/null
      - name: Upload signed v340 APK
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v340-SMS-History-Original-Card-Legibility-Release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload integrated v340 source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v340-SMS-History-Original-Card-Legibility-Source
          path: DevMonitor-An-v340-4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY-ORIGINAL-CARD-LEGIBILITY.zip
          if-no-files-found: error
          retention-days: 30
