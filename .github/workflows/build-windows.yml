name: Build DevMonitor Android and Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Project ZIP
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      windows: ${{ steps.detect.outputs.windows }}
      zip_name: ${{ steps.detect.outputs.zip_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify ZIP uploaded in this commit
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            ZIP_LIST="$(git diff-tree --no-commit-id --name-only -r \
              "${GITHUB_SHA}" -- '*.zip')"
          else
            ZIP_LIST="$(find . -type f -name '*.zip' \
              -not -path './.git/*' | sort)"
          fi

          if [ -z "$ZIP_LIST" ]; then
            echo "No ZIP found for this build."
            exit 1
          fi

          ANDROID=false
          WINDOWS=false
          SELECTED=""

          while IFS= read -r ZIP; do
            [ -z "$ZIP" ] && continue
            [ -f "$ZIP" ] || continue

            echo "Inspecting $ZIP"

            if unzip -Z1 "$ZIP" | grep -qE '(^|/)gradlew\.bat$' &&
               unzip -Z1 "$ZIP" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              ANDROID=true
              SELECTED="$ZIP"
              break
            fi

            if unzip -Z1 "$ZIP" | grep -qE '(^|/)DevMonitor\.Windows\.csproj$'; then
              WINDOWS=true
              SELECTED="$ZIP"
              break
            fi
          done <<< "$ZIP_LIST"

          if [ -z "$SELECTED" ]; then
            echo "ZIP did not contain a recognized Android or Windows project."
            exit 1
          fi

          # Confirm project type using the selected ZIP.
          CONTENTS="$(unzip -Z1 "$SELECTED")"

          if echo "$CONTENTS" | grep -qE '(^|/)gradlew\.bat$' &&
             echo "$CONTENTS" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
            ANDROID=true
            WINDOWS=false
          elif echo "$CONTENTS" | grep -qE '(^|/)DevMonitor\.Windows\.csproj$'; then
            ANDROID=false
            WINDOWS=true
          fi

          echo "Selected ZIP: $SELECTED"
          echo "Android: $ANDROID"
          echo "Windows: $WINDOWS"

          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS" >> "$GITHUB_OUTPUT"
          echo "zip_name=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Upload selected source ZIP for build jobs
        uses: actions/upload-artifact@v4
        with:
          name: selected-source-${{ github.run_number }}
          path: ${{ steps.detect.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android APK
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download selected source ZIP
        uses: actions/download-artifact@v4
        with:
          name: selected-source-${{ github.run_number }}
          path: incoming

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-source
          ZIP="$(find incoming -type f -name '*.zip' | head -n 1)"
          unzip -q "$ZIP" -d android-source

          WRAPPER="$(find android-source -type f -name gradlew \
            | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found."
            exit 1
          fi

          echo "ANDROID_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          find android-source -type f -path '*/build/outputs/apk/*' \
            -name '*.apk' -exec cp {} artifacts/ \;

          if ! find artifacts -name '*.apk' -print -quit | grep -q .; then
            echo "No APK was produced."
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Android-APK-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build Windows Application and Installer
    needs: detect
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Download selected source ZIP
        uses: actions/download-artifact@v4
        with:
          name: selected-source-${{ github.run_number }}
          path: incoming

      - name: Extract Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem incoming -Filter "*.zip" -Recurse -File |
            Select-Object -First 1

          if (-not $zip) {
            throw "Selected source ZIP not found."
          }

          $source = Join-Path $env:GITHUB_WORKSPACE "windows-source"
          New-Item -ItemType Directory -Path $source -Force |
            Out-Null

          Expand-Archive -LiteralPath $zip.FullName `
            -DestinationPath $source -Force

          $project = Get-ChildItem $source `
            -Filter "DevMonitor.Windows.csproj" -Recurse -File |
            Select-Object -First 1

          if (-not $project) {
            throw "DevMonitor.Windows.csproj not found."
          }

          "PROJECT_FILE=$($project.FullName)" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore "$env:PROJECT_FILE"
          if ($LASTEXITCODE -ne 0) {
            throw "Restore failed."
          }

      - name: Publish Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"
          New-Item -ItemType Directory -Path $publish -Force |
            Out-Null

          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$publish" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

          if ($LASTEXITCODE -ne 0) {
            throw "Windows publish failed."
          }

          if (-not (Test-Path (Join-Path $publish "DevMonitor.exe"))) {
            throw "DevMonitor.exe not found in publish output."
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Application-${{ github.run_number }}
          path: publish/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"
          $installer = Join-Path $env:GITHUB_WORKSPACE "installer"
          $script = Join-Path $env:GITHUB_WORKSPACE "DevMonitorInstaller.iss"

          New-Item -ItemType Directory -Path $installer -Force |
            Out-Null

          @(
            '[Setup]'
            'AppId={{9F55A2C7-4F8B-4B9B-9A75-DEV-MONITOR}}'
            'AppName=DevMonitor'
            'AppVersion=4.6.0'
            'AppPublisher=DevMonitor'
            'DefaultDirName={autopf}\DevMonitor'
            'DefaultGroupName=DevMonitor'
            'OutputDir=installer'
            'OutputBaseFilename=DevMonitor-Setup'
            'Compression=lzma'
            'SolidCompression=yes'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'PrivilegesRequired=admin'
            'WizardStyle=modern'
            ''
            '[Files]'
            "Source: `"$publish\*`"; DestDir: `"{app}`"; Flags: recursesubdirs ignoreversion"
            ''
            '[Icons]'
            'Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"'
            ''
            '[Run]'
            'Filename: "{app}\DevMonitor.exe"; Description: "Launch DevMonitor"; Flags: nowait postinstall skipifsilent'
          ) | Set-Content -Path $script -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found."
          }

          & $iscc "$env:GITHUB_WORKSPACE\DevMonitorInstaller.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-${{ github.run_number }}
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 90
