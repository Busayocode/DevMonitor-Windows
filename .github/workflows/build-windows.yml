name: Build DevMonitor Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  build:
    name: Build DevMonitor Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.zip" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $zip) {
            throw "No source ZIP found in repository."
          }

          Write-Host "Source ZIP:"
          Write-Host $zip.FullName

          "SOURCE_ZIP=$($zip.FullName)" >> $env:GITHUB_ENV
          "SOURCE_NAME=$($zip.Name)" >> $env:GITHUB_ENV

      - name: Extract source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "source"

          New-Item `
            -ItemType Directory `
            -Path $source `
            -Force |
            Out-Null

          Expand-Archive `
            -Path $env:SOURCE_ZIP `
            -DestinationPath $source `
            -Force

          Write-Host "Source extracted."

      - name: Find Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "source") `
            -Filter "DevMonitor.Windows.csproj" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $project) {
            throw "DevMonitor.Windows.csproj was not found in the source ZIP."
          }

          Write-Host "Project found:"
          Write-Host $project.FullName

          "PROJECT_FILE=$($project.FullName)" >> $env:GITHUB_ENV
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore "$env:PROJECT_FILE"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup --yes --no-progress

      - name: Publish application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"

          New-Item `
            -ItemType Directory `
            -Path $publish `
            -Force |
            Out-Null

          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$publish" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

      - name: Create installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"
          $installer = Join-Path $env:GITHUB_WORKSPACE "installer"
          $script = Join-Path $env:GITHUB_WORKSPACE "DevMonitorInstaller.iss"

          New-Item `
            -ItemType Directory `
            -Path $installer `
            -Force |
            Out-Null

          $lines = @(
            '[Setup]'
            'AppId={{9F55A2C7-4F8B-4B9B-9A75-DEV-MONITOR}}'
            'AppName=DevMonitor'
            'AppVersion=1.0.0'
            'AppPublisher=DevMonitor'
            'DefaultDirName={autopf}\DevMonitor'
            'DefaultGroupName=DevMonitor'
            'UninstallDisplayName=DevMonitor'
            "OutputDir=$installer"
            'OutputBaseFilename=DevMonitor-Setup'
            'Compression=lzma'
            'SolidCompression=yes'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'PrivilegesRequired=admin'
            'DisableProgramGroupPage=yes'
            'WizardStyle=modern'
            ''
            '[Files]'
            "Source: `"$publish\*`"; DestDir: `"{app}`"; Flags: recursesubdirs ignoreversion"
            ''
            '[Icons]'
            'Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"'
            'Name: "{autodesktop}\DevMonitor"; Filename: "{app}\DevMonitor.exe"; Tasks: desktopicon'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"'
            ''
            '[Run]'
            'Filename: "{app}\DevMonitor.exe"; Description: "Launch DevMonitor"; Flags: nowait postinstall skipifsilent'
          )

          $lines |
            Set-Content `
              -Path $script `
              -Encoding UTF8

          Write-Host "Installer script created."

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "DevMonitorInstaller.iss"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found."
          }

          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed."
          }

      - name: Find installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "installer") `
            -Filter "*.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "Installer EXE was not created."
          }

          Write-Host "=========================================="
          Write-Host "DevMonitor installer created:"
          Write-Host $installer.FullName
          Write-Host "=========================================="

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-${{ github.run_number }}
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 90
