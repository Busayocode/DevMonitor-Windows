name: Build DevMonitor Android and Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Uploaded ZIP
    runs-on: windows-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      windows: ${{ steps.detect.outputs.windows }}
      android_dir: ${{ steps.detect.outputs.android_dir }}
      windows_project: ${{ steps.detect.outputs.windows_project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and identify projects
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE
          $extractBase = Join-Path $workspace "source-unpacked"

          New-Item -ItemType Directory -Path $extractBase -Force |
            Out-Null

          $zipPaths = @()

          if ("${{ github.event_name }}" -eq "push") {
            $changed = @(
              git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA
            )

            $zipPaths = @(
              $changed |
                Where-Object { $_ -match '(?i)\.zip$' } |
                ForEach-Object {
                  Join-Path $workspace $_
                } |
                Where-Object {
                  Test-Path -LiteralPath $_ -PathType Leaf
                }
            )
          }
          else {
            $zipPaths = @(
              Get-ChildItem -Path $workspace -Filter "*.zip" `
                -Recurse -File |
                Where-Object {
                  $_.FullName -notlike "$extractBase\*"
                } |
                Sort-Object LastWriteTime -Descending |
                ForEach-Object { $_.FullName }
            )
          }

          if ($zipPaths.Count -eq 0) {
            throw "No ZIP file was found for this build."
          }

          $androidDir = ""
          $windowsProject = ""
          $index = 0

          foreach ($zip in $zipPaths) {
            $index++
            $destination = Join-Path $extractBase "zip-$index"

            Write-Host "Inspecting uploaded ZIP: $zip"

            New-Item -ItemType Directory -Path $destination -Force |
              Out-Null

            Expand-Archive -LiteralPath $zip `
              -DestinationPath $destination -Force

            if (-not $androidDir) {
              $wrappers = @(
                Get-ChildItem -Path $destination `
                  -Filter "gradlew.bat" -Recurse -File
              )

              foreach ($wrapper in $wrappers) {
                $dir = $wrapper.Directory.FullName

                $settings = Get-ChildItem -Path $dir `
                  -File |
                  Where-Object {
                    $_.Name -eq "settings.gradle" -or
                    $_.Name -eq "settings.gradle.kts"
                  } |
                  Select-Object -First 1

                if ($settings) {
                  $androidDir = $dir
                  Write-Host "Android project found: $androidDir"
                  break
                }
              }
            }

            if (-not $windowsProject) {
              $project = Get-ChildItem -Path $destination `
                -Filter "DevMonitor.Windows.csproj" `
                -Recurse -File |
                Select-Object -First 1

              if ($project) {
                $windowsProject = $project.FullName
                Write-Host "Windows project found: $windowsProject"
              }
            }
          }

          "android=$([bool]$androidDir)".ToLower() |
            ForEach-Object {
              "android=$($_.ToString().ToLower())" |
                Out-Null
            }

          $androidFlag = "false"
          $windowsFlag = "false"

          if ($androidDir) { $androidFlag = "true" }
          if ($windowsProject) { $windowsFlag = "true" }

          "android=$androidFlag" >> $env:GITHUB_OUTPUT
          "windows=$windowsFlag" >> $env:GITHUB_OUTPUT
          "android_dir=$androidDir" >> $env:GITHUB_OUTPUT
          "windows_project=$windowsProject" >> $env:GITHUB_OUTPUT

          if (-not $androidDir -and -not $windowsProject) {
            throw "The uploaded ZIP contains neither a supported Android Gradle project nor DevMonitor.Windows.csproj."
          }

          Write-Host "Android detected: $androidFlag"
          Write-Host "Windows detected: $windowsFlag"

  build-android:
    name: Build Android APK
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: pwsh
        working-directory: ${{ needs.detect.outputs.android_dir }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\gradlew.bat")) {
            throw "Gradle wrapper not found."
          }

          & .\gradlew.bat assembleDebug --no-daemon

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed."
          }

      - name: Collect APK files
        shell: pwsh
        working-directory: ${{ needs.detect.outputs.android_dir }}
        run: |
          $ErrorActionPreference = "Stop"

          $output = Join-Path $env:GITHUB_WORKSPACE "android-artifacts"

          New-Item -ItemType Directory -Path $output -Force |
            Out-Null

          $apks = @(
            Get-ChildItem -Path . -Filter "*.apk" `
              -Recurse -File |
              Where-Object {
                $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]'
              }
          )

          if ($apks.Count -eq 0) {
            throw "Build succeeded but no APK was found."
          }

          foreach ($apk in $apks) {
            $target = Join-Path $output $apk.Name
            Copy-Item -LiteralPath $apk.FullName -Destination $target -Force
          }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Android-APK-${{ github.run_number }}
          path: android-artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build Windows EXE and Installer
    needs: detect
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "${{ needs.detect.outputs.windows_project }}"

          dotnet restore "$project"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows project restore failed."
          }

      - name: Publish Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ needs.detect.outputs.windows_project }}"
          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"

          New-Item -ItemType Directory -Path $publish -Force |
            Out-Null

          dotnet publish "$project" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$publish" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

          if ($LASTEXITCODE -ne 0) {
            throw "Windows application publish failed."
          }

          if (-not (Test-Path (Join-Path $publish "DevMonitor.exe"))) {
            throw "DevMonitor.exe was not produced."
          }

      - name: Upload Windows application EXE
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Application-${{ github.run_number }}
          path: publish/DevMonitor.exe
          if-no-files-found: error
          retention-days: 90

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --yes --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"
          $installer = Join-Path $env:GITHUB_WORKSPACE "installer"
          $script = Join-Path $env:GITHUB_WORKSPACE "DevMonitorInstaller.iss"

          New-Item -ItemType Directory -Path $installer -Force |
            Out-Null

          $lines = @(
            '[Setup]'
            'AppId={{9F55A2C7-4F8B-4B9B-9A75-DEV-MONITOR}}'
            'AppName=DevMonitor'
            'AppVersion=4.6.0'
            'AppPublisher=DevMonitor'
            'DefaultDirName={autopf}\DevMonitor'
            'DefaultGroupName=DevMonitor'
            'UninstallDisplayName=DevMonitor'
            "OutputDir=$installer"
            'OutputBaseFilename=DevMonitor-Setup'
            'Compression=lzma'
            'SolidCompression=yes'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'PrivilegesRequired=admin'
            'DisableProgramGroupPage=yes'
            'WizardStyle=modern'
            ''
            '[Files]'
            "Source: `"$publish\*`"; DestDir: `"{app}`"; Flags: recursesubdirs ignoreversion"
            ''
            '[Icons]'
            'Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"'
            'Name: "{autodesktop}\DevMonitor"; Filename: "{app}\DevMonitor.exe"; Tasks: desktopicon'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"'
            ''
            '[Run]'
            'Filename: "{app}\DevMonitor.exe"; Description: "Launch DevMonitor"; Flags: nowait postinstall skipifsilent'
          )

          $lines | Set-Content -Path $script -Encoding UTF8

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "DevMonitorInstaller.iss"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found."
          }

          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-${{ github.run_number }}
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 90
```
