name: Build DevMonitor Android and Windows

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '.github/workflows/build-devmonitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      android_zip: ${{ steps.detect.outputs.android_zip }}
      windows_zip: ${{ steps.detect.outputs.windows_zip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect source ZIPs by their contents
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, subprocess, zipfile
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          candidates = []

          if event == "push":
              result = subprocess.run(
                  ["git", "diff-tree", "--no-commit-id",
                   "--name-only", "-r", os.environ["GITHUB_SHA"]],
                  check=True, text=True, capture_output=True
              )
              candidates = [
                  Path(x) for x in result.stdout.splitlines()
                  if x.lower().endswith(".zip")
              ]

          if not candidates:
              result = subprocess.run(
                  ["git", "ls-files", "-z", "*.zip"],
                  check=True, capture_output=True
              )
              candidates = [
                  Path(x.decode()) for x in result.stdout.split(b"\0") if x
              ]

          candidates = list(dict.fromkeys(
              p for p in candidates if p.is_file()
          ))

          def natural_key(value):
              return [
                  (0, int(part)) if part.isdigit() else (1, part.lower())
                  for part in re.split(r"(\d+)", str(value))
              ]

          android = []
          windows = []
          scanned = set()

          def scan(path):
              if path in scanned or not path.is_file():
                  return
              scanned.add(path)

              try:
                  with zipfile.ZipFile(path) as archive:
                      names = {
                          name.replace("\\", "/").lower().lstrip("./")
                          for name in archive.namelist()
                          if not name.endswith("/")
                      }
              except (OSError, zipfile.BadZipFile) as exc:
                  print(f"Skipping invalid ZIP {path}: {exc}")
                  return

              has_wrapper = any(
                  name in ("gradlew", "gradlew.bat")
                  or name.endswith("/gradlew")
                  or name.endswith("/gradlew.bat")
                  for name in names
              )

              has_settings = any(
                  name in ("settings.gradle", "settings.gradle.kts")
                  or name.endswith("/settings.gradle")
                  or name.endswith("/settings.gradle.kts")
                  for name in names
              )

              has_android_build = any(
                  name in ("app/build.gradle", "app/build.gradle.kts")
                  or name.endswith("/app/build.gradle")
                  or name.endswith("/app/build.gradle.kts")
                  for name in names
              )

              has_windows_project = any(
                  name == "devmonitor.windows.csproj"
                  or name.endswith("/devmonitor.windows.csproj")
                  for name in names
              )

              if has_wrapper and has_settings and has_android_build:
                  android.append(path)
                  print(f"Android source detected: {path}")

              if has_windows_project:
                  windows.append(path)
                  print(f"Windows source detected: {path}")

          for candidate in candidates:
              scan(candidate)

          # If a push did not contain a recognised source ZIP,
          # inspect all tracked ZIPs before failing.
          if event == "push" and not android and not windows:
              result = subprocess.run(
                  ["git", "ls-files", "-z", "*.zip"],
                  check=True, capture_output=True
              )
              for raw in result.stdout.split(b"\0"):
                  if raw:
                      scan(Path(raw.decode()))

          android_zip = (
              str(sorted(set(android), key=natural_key)[-1])
              if android else ""
          )
          windows_zip = (
              str(sorted(set(windows), key=natural_key)[-1])
              if windows else ""
          )

          if not android_zip and not windows_zip:
              raise SystemExit(
                  "No valid Android or Windows source ZIP was found. "
                  "Ensure a source ZIP is committed to the repository "
                  "and contains its project files."
              )

          print(f"Selected Android ZIP: {android_zip or '(none)'}")
          print(f"Selected Windows ZIP: {windows_zip or '(none)'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"android_zip={android_zip}\n")
              out.write(f"windows_zip={windows_zip}\n")
          PY

  build-android:
    needs: detect
    if: needs.detect.outputs.android_zip != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select detected Android ZIP
        shell: bash
        env:
          ZIP_FILE: ${{ needs.detect.outputs.android_zip }}
        run: |
          set -euo pipefail
          [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ] || {
            echo "ERROR: Detected Android source ZIP not found: $ZIP_FILE"
            exit 1
          }
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Selected Android ZIP: $ZIP_FILE"

      - name: Extract DevMonitor project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-source
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find build-source -maxdepth 6 -type f -name gradlew | head -n 1)"
          [ -n "$GRADLEW" ] || { echo "ERROR: Gradle wrapper not found."; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify Android v337 source correction is in the ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          mains = list(Path("build-source").rglob("MainActivity.kt"))
          builds = list(Path("build-source").rglob("app/build.gradle.kts"))
          if len(mains) != 1 or len(builds) != 1:
              raise SystemExit(
                  f"Expected one MainActivity.kt and one app/build.gradle.kts; "
                  f"found {len(mains)} and {len(builds)}."
              )
          source = mains[0].read_text(encoding="utf-8")
          gradle = builds[0].read_text(encoding="utf-8")
          if "return@forEachIndexed" in source:
              raise SystemExit("Android ZIP still contains the invalid return@forEachIndexed.")
          if not re.search(r'message = "Send failed: \$code"\s*\n\s*continue', source):
              raise SystemExit("Queued Recheck send-failure branch is not permanently corrected in the ZIP.")
          if not re.search(r'versionCode\s*=\s*337', gradle):
              raise SystemExit("Android ZIP must already declare versionCode 337.")
          if 'versionName = "4.7.0-TARGET-KOTLIN-RECHECK-CONTINUE-FIX-V337"' not in gradle:
              raise SystemExit("Android ZIP versionName does not match the v337 source.")
          print("Android v337 Kotlin correction and version metadata verified in source ZIP; no build-time source patching.")
          PY

      - name: Generate automated What's New release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/scripts/generate_release_notes.py"

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          [ -f "$BUILD_FILE" ] || { echo "ERROR: app/build.gradle.kts not found."; exit 1; }
          VERSION_NAME="$(grep -E 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' "$BUILD_FILE" | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -E 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' "$BUILD_FILE" | head -n 1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')"
          [ -n "$VERSION_NAME" ] && [ -n "$VERSION_CODE" ] || { echo "ERROR: Could not read version."; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=DevMonitor-${VERSION_NAME}-v${VERSION_CODE}-release" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FIELD_PULSE_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_REPORT_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "ERROR: Configure FIELD_PULSE_RELEASE_KEYSTORE_BASE64 or RELEASE_KEYSTORE_BASE64."; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "ERROR: RELEASE_STORE_PASSWORD secret is missing."; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "ERROR: RELEASE_KEY_ALIAS secret is missing."; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "ERROR: RELEASE_KEY_PASSWORD secret is missing."; exit 1; }
          [ -n "$DRIVE_API_KEY" ] || { echo "ERROR: DRIVE_REPORT_API_KEY secret is missing."; exit 1; }
          # Android's release signing config is declared in app/build.gradle.kts.
          # Gradle's file(...) therefore resolves relative paths from the app module,
          # not from the repository root. Put the keystore exactly where Gradle expects it.
          KEYSTORE_PATH="$PROJECT_DIR/app/fieldpulse-release.jks"
          mkdir -p "$PROJECT_DIR/app"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ] || { echo "ERROR: Decoded release keystore is empty."; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore decoded and alias verified (contents hidden)."

          # Replace any previous release properties, then set an absolute keystore path
          # so Gradle cannot resolve it against the wrong project directory.
          FILTERED_PROPERTIES="$(mktemp)"
          sed -E '/^[[:space:]]*RELEASE_STORE_FILE[[:space:]]*=/d; /^[[:space:]]*RELEASE_STORE_PASSWORD[[:space:]]*=/d; /^[[:space:]]*RELEASE_KEY_ALIAS[[:space:]]*=/d; /^[[:space:]]*RELEASE_KEY_PASSWORD[[:space:]]*=/d; /^[[:space:]]*DRIVE_REPORT_API_KEY[[:space:]]*=/d' "$PROJECT_DIR/gradle.properties" > "$FILTERED_PROPERTIES"
          cat "$FILTERED_PROPERTIES" > "$PROJECT_DIR/gradle.properties"
          rm -f "$FILTERED_PROPERTIES"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            printf 'DRIVE_REPORT_API_KEY=%s\n' "$DRIVE_API_KEY"
          } >> "$PROJECT_DIR/gradle.properties"

          # Fail early with a clear diagnostic if the signing file is not at the
          # exact path Gradle will consume.
          [ -f "$PROJECT_DIR/app/fieldpulse-release.jks" ] || {
            echo "ERROR: Release keystore is not at the Android app module signing path."
            exit 1
          }

      - name: Verify Firebase package and release identity record
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          grep -q '"package_name": "com.aziitech.simregmonitor"' app/google-services.json || { echo "ERROR: google-services.json package mismatch."; exit 1; }
          echo "Firebase package matches com.aziitech.simregmonitor"
          echo "Expected release SHA-1: 8A:C3:1B:96:52:7D:F8:96:83:D5:84:A6:D5:99:10:0D:88:5D:F5:36"
          echo "NOTE: Firebase must have this SHA-1 registered; the generated google-services.json should be refreshed after registration."

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Online Reports configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_REPORT_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os
          from pathlib import Path

          props = Path("gradle.properties").read_text(encoding="utf-8").splitlines()
          expected = os.environ.get("DRIVE_API_KEY", "")
          actual = [line.split("=", 1)[1] for line in props if line.startswith("DRIVE_REPORT_API_KEY=")]
          folder = [line.split("=", 1)[1] for line in props if line.startswith("DRIVE_REPORT_FOLDER_ID=")]

          if not expected or actual != [expected]:
              raise SystemExit("ERROR: top-level Gradle API-key property is missing, duplicated, or mismatched.")

          if folder != ["1d2mCmBiFgQXjIYHAvgjXAD_JgSvITbwI"]:
              raise SystemExit("ERROR: Online Reports folder ID is missing, duplicated, or mismatched.")

          generated = list(Path("app/build/generated").rglob("BuildConfig.java"))
          if not any(
              "DRIVE_REPORT_API_KEY" in p.read_text(encoding="utf-8")
              and expected in p.read_text(encoding="utf-8")
              for p in generated
          ):
              raise SystemExit("ERROR: generated BuildConfig does not contain the configured Online Reports API key.")

          print("Online Reports folder ID and API key verified in the generated release configuration (values hidden).")
          PYCODE

      - name: Verify release APK certificate
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "ERROR: Release APK not produced."; exit 1; }
          EXPECTED='8A:C3:1B:96:52:7D:F8:96:83:D5:84:A6:D5:99:10:0D:88:5D:F5:36'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [ -n "$APKSIGNER" ] || { echo "ERROR: Android apksigner not found."; exit 1; }
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n 1)"
          echo "Release APK SHA-1: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "ERROR: APK signing SHA-1 does not match the FieldPulse release certificate."; exit 1; }

      - name: Rename release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/${ARTIFACT_BASE}.apk"
          echo "FINAL_APK=$APK_DIR/${ARTIFACT_BASE}.apk" >> "$GITHUB_ENV"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          echo "BUILD COMPLETE"
          echo "Version: $VERSION_NAME"
          echo "Code: $VERSION_CODE"
          echo "Artifact: ${ARTIFACT_BASE}.apk"
          echo "Package: com.aziitech.simregmonitor"
          echo "Release alias: fieldpulse-release"
          echo "Release SHA-1: 8A:C3:1B:96:52:7D:F8:96:83:D5:84:A6:D5:99:10:0D:88:5D:F5:36"

  build-windows:
    needs: detect
    if: needs.detect.outputs.windows_zip != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Windows source
        shell: pwsh
        env:
          SOURCE_ZIP: ${{ needs.detect.outputs.windows_zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:SOURCE_ZIP)) {
            throw "Selected Windows ZIP not found: $env:SOURCE_ZIP"
          }

          if (Test-Path .\build-source) {
            Remove-Item .\build-source -Recurse -Force
          }
          New-Item -ItemType Directory -Path .\build-source | Out-Null
          Expand-Archive -LiteralPath $env:SOURCE_ZIP `
            -DestinationPath .\build-source -Force

          $project = Get-ChildItem .\build-source `
            -Filter 'DevMonitor.Windows.csproj' -File -Recurse |
            Select-Object -First 1

          if (-not $project) {
            throw 'DevMonitor.Windows.csproj was not found inside the ZIP.'
          }

          $projectDir = $project.Directory.FullName
          "PROJECT_DIR=$projectDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows project directory: $projectDir"

      - name: Restore Windows solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $solution = Join-Path $env:PROJECT_DIR 'DevMonitor.Windows.sln'

          if (Test-Path $solution) {
            dotnet restore $solution
          } else {
            dotnet restore (Join-Path $env:PROJECT_DIR 'DevMonitor.Windows.csproj')
          }

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed: $LASTEXITCODE"
          }

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:PROJECT_DIR 'publish'

          dotnet publish `
            (Join-Path $env:PROJECT_DIR 'DevMonitor.Windows.csproj') `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o $outDir

          if ($LASTEXITCODE -ne 0) {
            throw "Windows publish failed: $LASTEXITCODE"
          }
          if (-not (Test-Path (Join-Path $outDir 'DevMonitor.exe'))) {
            throw 'DevMonitor.exe was not produced.'
          }

      - name: Publish HTTPS sync relay when included
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $relayProject = Join-Path $env:PROJECT_DIR `
            'SyncRelay\DevMonitor.SyncRelay.csproj'

          if (Test-Path $relayProject) {
            $relayOut = Join-Path $env:PROJECT_DIR 'relay-publish'
            dotnet publish $relayProject -c Release -r win-x64 `
              --self-contained true -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -o $relayOut

            if ($LASTEXITCODE -ne 0) {
              throw "Sync relay publish failed: $LASTEXITCODE"
            }
          } else {
            Write-Host 'No SyncRelay project in this ZIP; skipping relay.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iss = Join-Path $env:PROJECT_DIR 'DevMonitor-Setup.iss'

          if (-not (Test-Path $iss)) {
            throw 'DevMonitor-Setup.iss was not found.'
          }

          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed: $LASTEXITCODE"
          }

          $installerDir = Join-Path $env:PROJECT_DIR 'installer'
          $installer = Get-ChildItem $installerDir `
            -Filter 'DevMonitor-Setup-*.exe' -File `
            -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $installer) {
            throw "Installer EXE was not produced in $installerDir. Check OutputDir in DevMonitor-Setup.iss."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer
          path: ${{ env.PROJECT_DIR }}\installer\DevMonitor-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Portable
          path: ${{ env.PROJECT_DIR }}\publish\**
          if-no-files-found: error
          retention-days: 30

      - name: Upload sync relay when built
        if: ${{ hashFiles('build-source/**/SyncRelay/DevMonitor.SyncRelay.csproj') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Sync-Relay
          path: ${{ env.PROJECT_DIR }}\relay-publish\**
          if-no-files-found: warn
          retention-days: 30
