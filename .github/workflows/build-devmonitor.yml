
name: Build DevMonitor Android and Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect uploaded source ZIPs
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      windows: ${{ steps.detect.outputs.windows }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Android and Windows source ZIPs
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p selected-sources

          python3 <<'PY'
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          event = os.environ["GITHUB_EVENT_NAME"]
          before = os.environ.get("BEFORE_SHA", "")
          sha = os.environ["GITHUB_SHA"]

          if event == "push" and before and set(before) != {"0"}:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", before, sha],
                  check=True, capture_output=True, text=True
              )
              paths = [
                  Path(p) for p in diff.stdout.splitlines()
                  if p.lower().endswith(".zip") and Path(p).is_file()
              ]
          else:
              result = subprocess.run(
                  ["git", "ls-files", "-z"],
                  check=True, capture_output=True
              )
              paths = [
                  Path(p.decode()) for p in result.stdout.split(b"\0")
                  if p and p.decode().lower().endswith(".zip")
                  and Path(p.decode()).is_file()
              ]

          def changed_time(path):
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", str(path)],
                  capture_output=True, text=True
              )
              try:
                  return int(result.stdout.strip() or "0")
              except ValueError:
                  return 0

          paths = sorted(
              set(paths),
              key=lambda p: (changed_time(p), str(p)),
              reverse=True
          )

          android_zip = None
          windows_zip = None

          for path in paths:
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = {
                          n.replace("\\", "/").lower()
                          for n in archive.namelist()
                      }
              except (OSError, zipfile.BadZipFile):
                  print(f"Skipping invalid ZIP: {path}")
                  continue

              has_wrapper = any(
                  n == "gradlew.bat" or n.endswith("/gradlew.bat")
                  for n in names
              )
              has_settings = any(
                  n.endswith("/settings.gradle")
                  or n.endswith("/settings.gradle.kts")
                  for n in names
              )
              has_windows_project = any(
                  n == "devmonitor.windows.csproj"
                  or n.endswith("/devmonitor.windows.csproj")
                  for n in names
              )

              if android_zip is None and has_wrapper and has_settings:
                  android_zip = path

              if windows_zip is None and has_windows_project:
                  windows_zip = path

              if android_zip and windows_zip:
                  break

          output_dir = Path("selected-sources")

          if android_zip:
              (output_dir / "android-source.zip").write_bytes(
                  android_zip.read_bytes()
              )
              print(f"Selected Android ZIP: {android_zip}")

          if windows_zip:
              (output_dir / "windows-source.zip").write_bytes(
                  windows_zip.read_bytes()
              )
              print(f"Selected Windows ZIP: {windows_zip}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"android={'true' if android_zip else 'false'}\n")
              output.write(f"windows={'true' if windows_zip else 'false'}\n")

          if not android_zip and not windows_zip:
              raise SystemExit("No valid Android or Windows source ZIP was found.")
          PY

      - name: Upload selected source ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: selected-source-${{ github.run_number }}
          path: selected-sources/*.zip
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build signed Android release
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.android == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download selected source ZIP
        uses: actions/download-artifact@v4
        with:
          name: selected-source-${{ github.run_number }}
          path: selected-sources

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-source
          unzip -q selected-sources/android-source.zip -d android-source

          GRADLEW="$(find "$GITHUB_WORKSPACE/android-source" \
            -type f -name gradlew -print -quit)"

          if [[ -z "$GRADLEW" ]]; then
            echo "::error::Android Gradle wrapper not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::Android app/build.gradle.kts not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          : "${RELEASE_KEYSTORE_BASE64:?GitHub secret RELEASE_KEYSTORE_BASE64 is missing}"

          KEYSTORE="$RUNNER_TEMP/devmonitor-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Decoded signing keystore is empty."
            exit 1
          fi

          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Android signing keystore prepared."

      - name: Build signed Android release APK
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_DRIVE_REPORT_API_KEY: ${{ secrets.DRIVE_REPORT_API_KEY }}
        run: |
          set -euo pipefail

          : "${RELEASE_STORE_PASSWORD:?GitHub secret RELEASE_STORE_PASSWORD is missing}"
          : "${RELEASE_KEY_ALIAS:?GitHub secret RELEASE_KEY_ALIAS is missing}"
          : "${RELEASE_KEY_PASSWORD:?GitHub secret RELEASE_KEY_PASSWORD is missing}"
          : "${ORG_GRADLE_PROJECT_DRIVE_REPORT_API_KEY:?GitHub secret DRIVE_REPORT_API_KEY is missing}"

          cd "$ANDROID_PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            -PRELEASE_STORE_FILE="$RELEASE_KEYSTORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

          APK="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Expected release APK was not produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/android-artifacts"
          cp "$APK" \
            "$GITHUB_WORKSPACE/android-artifacts/DevMonitor-Android-Release.apk"

          echo "Signed release APK created; Drive API key was supplied to Gradle."

      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/android-artifacts/DevMonitor-Android-Release.apk"
          BUILD_TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          APKSIGNER="$(find "$BUILD_TOOLS" -type f -name apksigner \
            2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Android-Release-${{ github.run_number }}
          path: android-artifacts/DevMonitor-Android-Release.apk
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build Windows application and installer
    runs-on: windows-latest
    needs: detect
    if: needs.detect.outputs.windows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download selected source ZIP
        uses: actions/download-artifact@v4
        with:
          name: selected-source-${{ github.run_number }}
          path: selected-sources

      - name: Extract Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "windows-source" | Out-Null

          Expand-Archive `
            -LiteralPath "selected-sources/windows-source.zip" `
            -DestinationPath "windows-source" `
            -Force

          $project = Get-ChildItem `
            -Path "windows-source" `
            -Filter "DevMonitor.Windows.csproj" `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            throw "DevMonitor.Windows.csproj was not found in the ZIP."
          }

          "PROJECT_FILE=$($project.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore "$env:PROJECT_FILE"

      - name: Publish Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o "$env:GITHUB_WORKSPACE\windows-publish"

          $exe = Join-Path "$env:GITHUB_WORKSPACE\windows-publish" "DevMonitor.exe"

          if (-not (Test-Path $exe)) {
            throw "DevMonitor.exe was not produced."
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Application-${{ github.run_number }}
          path: windows-publish/**
          if-no-files-found: error
          retention-days: 90

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --yes --no-progress

      - name: Create Windows installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish = "$env:GITHUB_WORKSPACE\windows-publish"
          $output = "$env:GITHUB_WORKSPACE\windows-installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $iss = @"
          [Setup]
          AppId={{D4A38C14-5B91-4B3A-8A2B-5A9B3C7D2026}
          AppName=DevMonitor
          AppVersion=1.0.0
          AppPublisher=DevMonitor
          DefaultDirName={autopf}\DevMonitor
          DefaultGroupName=DevMonitor
          OutputDir=$output
          OutputBaseFilename=DevMonitor-Setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "$publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"
          Name: "{autodesktop}\DevMonitor"; Filename: "{app}\DevMonitor.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Run]
          Filename: "{app}\DevMonitor.exe"; Description: "Launch DevMonitor"; Flags: postinstall nowait skipifsilent
          "@

          $issPath = Join-Path "$env:GITHUB_WORKSPACE" "DevMonitorInstaller.iss"
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found."
          }

          & $compiler "$env:GITHUB_WORKSPACE\DevMonitorInstaller.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = "$env:GITHUB_WORKSPACE\windows-installer\DevMonitor-Setup.exe"

          if (-not (Test-Path $installer)) {
            throw "Windows installer was not produced."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-${{ github.run_number }}
          path: windows-installer/DevMonitor-Setup.exe
          if-no-files-found: error
          retention-days: 90
