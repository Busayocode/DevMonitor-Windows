name: Build DevMonitor Android SMS History Trial

on:
  push:
    branches: [History]
    paths:
      - 'android-history.patch.gz.b64'
      - '.github/workflows/build-sms-history-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-history-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout History branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Android v337 baseline and apply SMS history changes
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP='DevMonitor-An-v337-4.7.0-TARGET-KOTLIN-RECHECK-CONTINUE-FIX.zip'
          [ -f "$BASE_ZIP" ] || { echo "ERROR: Android v337 baseline ZIP is missing: $BASE_ZIP"; exit 1; }
          rm -rf build-source
          mkdir -p build-source
          unzip -q "$BASE_ZIP" -d build-source
          base64 --decode android-history.patch.gz.b64 | gzip -dc > android-history.patch
          patch --batch --forward -p1 -d build-source < android-history.patch
          GRADLEW="$(find build-source -maxdepth 6 -type f -name gradlew | head -n 1)"
          [ -n "$GRADLEW" ] || { echo 'ERROR: Gradle wrapper missing after patch.'; exit 1; }
          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd -P)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo 'Android v337 baseline patched to SMS Checker daily-history v338.'

      - name: Verify v338 source and version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path('build-source')
          main = list(root.rglob('MainActivity.kt'))
          store = list(root.rglob('SmsCheckerDailyHistoryStore.kt'))
          dialog = list(root.rglob('SmsCheckerHistoryDialog.kt'))
          gradle = list(root.rglob('app/build.gradle.kts'))
          if not all(len(x) == 1 for x in (main, store, dialog, gradle)):
              raise SystemExit('Expected exactly one MainActivity, history store, history dialog and app build file.')
          source = main[0].read_text(encoding='utf-8')
          store_text = store[0].read_text(encoding='utf-8')
          gradle_text = gradle[0].read_text(encoding='utf-8')
          if 'sms_checker_devices_history.db' not in source or 'sms_checker_partners_history.db' not in source:
              raise SystemExit('The two separate history database names are not wired into MainActivity.')
          if 'recordCompleted(record)' not in source:
              raise SystemExit('Completed SMS Checker results are not connected to the history store.')
          if 'AttemptStatus.TIMEOUT' not in store_text or 'AttemptStatus.SEND_FAILED' not in store_text:
              raise SystemExit('History store does not include failure outcomes.')
          if not re.search(r'versionCode\s*=\s*338', gradle_text):
              raise SystemExit('Android versionCode must be 338.')
          if '4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY-V338' not in gradle_text:
              raise SystemExit('Android versionName does not match v338.')
          print('v338 history databases, UI source and version metadata verified.')
          PY

      - name: Create patched Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP='DevMonitor-An-v338-4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY.zip'
          (cd build-source && zip -q -r "../$SOURCE_ZIP" .)
          unzip -t "$SOURCE_ZIP" >/dev/null
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Read Android version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          VERSION_NAME="$(grep -E 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' "$BUILD_FILE" | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -E 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' "$BUILD_FILE" | head -n 1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')"
          [ "$VERSION_CODE" = '338' ] || { echo "Unexpected versionCode: $VERSION_CODE"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=DevMonitor-${VERSION_NAME}-v${VERSION_CODE}-release" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing and Drive configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FIELD_PULSE_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_REPORT_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo 'ERROR: release keystore secret is missing.'; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo 'ERROR: RELEASE_STORE_PASSWORD secret is missing.'; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo 'ERROR: RELEASE_KEY_ALIAS secret is missing.'; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo 'ERROR: RELEASE_KEY_PASSWORD secret is missing.'; exit 1; }
          [ -n "$DRIVE_API_KEY" ] || { echo 'ERROR: DRIVE_REPORT_API_KEY secret is missing.'; exit 1; }
          KEYSTORE_PATH="$PROJECT_DIR/app/fieldpulse-release.jks"
          mkdir -p "$PROJECT_DIR/app"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ] || { echo 'ERROR: decoded release keystore is empty.'; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          FILTERED_PROPERTIES="$(mktemp)"
          sed -E '/^[[:space:]]*RELEASE_STORE_FILE[[:space:]]*=/d; /^[[:space:]]*RELEASE_STORE_PASSWORD[[:space:]]*=/d; /^[[:space:]]*RELEASE_KEY_ALIAS[[:space:]]*=/d; /^[[:space:]]*RELEASE_KEY_PASSWORD[[:space:]]*=/d; /^[[:space:]]*DRIVE_REPORT_API_KEY[[:space:]]*=/d' "$PROJECT_DIR/gradle.properties" > "$FILTERED_PROPERTIES"
          cat "$FILTERED_PROPERTIES" > "$PROJECT_DIR/gradle.properties"
          rm -f "$FILTERED_PROPERTIES"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            printf 'DRIVE_REPORT_API_KEY=%s\n' "$DRIVE_API_KEY"
          } >> "$PROJECT_DIR/gradle.properties"

      - name: Verify Firebase package
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          grep -q '"package_name": "com.aziitech.simregmonitor"' app/google-services.json
          echo 'Firebase package matches com.aziitech.simregmonitor.'

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build signed Android release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK signing identity
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          [ -f "$APK" ] || { echo 'ERROR: release APK was not produced.'; exit 1; }
          EXPECTED='8A:C3:1B:96:52:7D:F8:96:83:D5:84:A6:D5:99:10:0D:88:5D:F5:36'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [ -n "$APKSIGNER" ] || { echo 'ERROR: apksigner was not found.'; exit 1; }
          python3 - "$APKSIGNER" "$APK" "$EXPECTED" <<'PY'
          import re, subprocess, sys
          tool, apk, expected = sys.argv[1:]
          result = subprocess.run([tool, 'verify', '--verbose', '--print-certs', apk], text=True, capture_output=True)
          output = (result.stdout or '') + '\n' + (result.stderr or '')
          if result.returncode:
              print(output)
              raise SystemExit(result.returncode)
          match = re.search(r'certificate\s+SHA-1\s+digest\s*:\s*([0-9a-fA-F:]+)', output, re.I)
          if not match:
              print(output)
              raise SystemExit('Could not read APK SHA-1 digest.')
          if match.group(1).replace(':', '').lower() != expected.replace(':', '').lower():
              raise SystemExit('APK signing SHA-1 does not match the registered FieldPulse release identity.')
          print('Release APK certificate identity verified.')
          PY

      - name: Rename signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/${ARTIFACT_BASE}.apk"
          echo "FINAL_APK=$APK_DIR/${ARTIFACT_BASE}.apk" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload patched v338 source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-An-v338-4.7.0-TARGET-SMS-CHECKER-DAILY-HISTORY-Source
          path: ${{ env.SOURCE_ZIP }}
          if-no-files-found: error
          retention-days: 30
