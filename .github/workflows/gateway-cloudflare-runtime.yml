name: Gateway Cloudflare Backend Build

on:
  push:
    branches:
      - gateway-5.0-cloudflare-adaptation
    paths:
      - "controller/cloudflare/worker/**"
      - ".github/workflows/gateway-cloudflare-runtime.yml"
  pull_request:
    paths:
      - "controller/cloudflare/worker/**"
      - ".github/workflows/gateway-cloudflare-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    name: Typecheck, safety tests, D1 schema and Worker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller/cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: controller/cloudflare/worker/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Gateway safety tests
        run: npm test
      - name: Validate complete D1 schema locally
        run: npx wrangler d1 execute devmonitor-gateway --local --file=./schema.sql
      - name: Compile Worker without deploying
        run: npm run build
